# Builds and publishes the binaries that servers update themselves to.
#
# This workflow is the trusted end of the self-update path: a running monitor
# installs whatever it publishes, verified against the checksums.txt produced
# here. Two properties matter and are easy to lose.
#
# It runs only on a tag, so publishing is a deliberate act and an ordinary push
# to main cannot reach a server.
#
# And checksums.txt is generated from the very files that are uploaded, in the
# same job. Generating it anywhere else, or uploading assets built in a
# different step, would leave a gap where the thing verified is not the thing
# installed.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # go-version-file reads the pinned patch version out of go.mod, so the
      # released binary is built with the toolchain the vulnerability check
      # was run against.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify before publishing
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
          go test ./...
          go tool govulncheck ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"

          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="dmarc-monitor-${os}-${arch}"

            echo "building ${name} ${version}"
            GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}" \
              ./cmd/dmarc-monitor
          done

      # sha256sum's own format, which is what selfupdate parses and what an
      # operator can check by hand with `sha256sum -c checksums.txt`.
      - name: Checksums
        working-directory: dist
        run: sha256sum dmarc-monitor-* > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/dmarc-monitor-* dist/checksums.txt
