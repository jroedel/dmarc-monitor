# Propose the newest Go patch release, the one bump Dependabot cannot make.
#
# The go line in go.mod is the toolchain everything is built with: CI and the
# release build both read it (go-version-file). Dependabot moves require lines
# and never that one, so a standard-library vulnerability -- the likeliest
# kind, for a binary with two dependencies -- turned the weekly govulncheck run
# red and stayed red until a person bumped it by hand. That happened with
# GO-2026-6809 in crypto/x509, fixed in go1.26.10.
#
# Only patch releases of the minor go.mod already names: 1.26.9 to 1.26.10, never
# 1.26 to 1.27. A new minor changes the language and the standard library, and
# is a person's decision.
#
# Daily rather than weekly like Dependabot: the run is a few seconds and ends
# with nothing to do on all but the handful of days a year Go ships a patch,
# and those patches are usually security fixes. The pull request still waits a
# day before .github/workflows/dependabot-merge.yml merges it.
#
# # Why it dispatches CI itself
#
# A pull request opened with the repository's token does not trigger
# workflows, so CI would never run on it and the merge would wait for ever on
# checks that never come. workflow_dispatch is the exception, and a dispatched
# run's checks land on the branch's head commit, which is where the merge
# looks for them.
#
# # What it needs
#
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests". Without it gh pr create is refused, and this run goes red,
# which is emailed, instead of quietly proposing nothing.
name: Go patch

on:
  schedule:
    # 05:45 UTC: before the 06:30 Dependabot merge, so a pull request opened
    # here is first eligible the next morning.
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: go-patch
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the newest patch of the minor go.mod names
        id: find
        run: |
          set -euo pipefail

          # A toolchain line would be a second answer to "which Go", and this
          # moves only the first; better to stop than to leave them disagreeing.
          if grep -q '^toolchain ' go.mod; then
            echo "go.mod has a toolchain line; this workflow only moves the go line"
            exit 1
          fi

          current=$(sed -n 's/^go //p' go.mod)
          minor=$(cut -d. -f1,2 <<<"$current")

          latest=$(curl -fsS 'https://go.dev/dl/?mode=json&include=all' | jq -r --arg minor "$minor" '
            [.[] | select(.stable) | .version | ltrimstr("go")
                 | select(startswith($minor + "."))]
            | sort_by(split(".") | map(tonumber)) | last // empty')

          [ -n "$latest" ] || { echo "go.dev lists no stable release of $minor"; exit 1; }

          echo "go.mod: $current; newest $minor release: $latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Propose it
        if: steps.find.outputs.current != steps.find.outputs.latest
        env:
          CURRENT: ${{ steps.find.outputs.current }}
          LATEST: ${{ steps.find.outputs.latest }}
        run: |
          set -euo pipefail
          branch="bump/go-$LATEST"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch is already proposed"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          sed -i "s/^go $CURRENT\$/go $LATEST/" go.mod
          git commit -q -am "Build with Go $LATEST"
          git push -q origin "$branch"

          gh pr create --base main --head "$branch" --title "Build with Go $LATEST" --body "$(cat <<BODY
          Moves the \`go\` line in go.mod from $CURRENT to $LATEST, the newest patch release of that minor version. Opened by \`.github/workflows/go-patch.yml\`, because Dependabot does not update this line.

          **What it does to the running monitor:** after a day with CI green, \`dependabot-merge.yml\` merges it and dispatches the deploy, which rebuilds the binary with Go $LATEST. Alerts, recipients and schedule are unchanged. The first scheduled run on the new build sends the usual deploy notice.

          Release notes: https://go.dev/doc/devel/release#go$(cut -d. -f1,2 <<<"$LATEST").minor
          BODY
          )"

          # The dispatch is what gives the pull request its checks; see the top
          # of this file.
          gh workflow run ci.yml --ref "$branch"

          # An older proposal still open would conflict with this one on the
          # same line once either merged. Its branch goes with it.
          gh pr list --state open --author app/github-actions --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"bump/go-\")) | select(.headRefName != \"$branch\") | .number" \
            | while read -r old; do
                gh pr close "$old" --delete-branch --comment "Superseded by Go $LATEST."
              done
