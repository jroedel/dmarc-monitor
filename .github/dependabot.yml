# Dependabot, for the two kinds of pin this repository holds. Same shape as
# eumaeus'.
#
# The actions are pinned by commit (see the comment in ci.yml), which is only
# sustainable if something proposes the bumps: Dependabot opens a pull request
# when a new release exists, moves the SHA and the version comment together,
# and CI runs on it. Weekly, on a Monday, so a bump lands as one review at the
# start of a week rather than as noise through it.
#
# Go modules the same way. govulncheck in CI already fails on a reachable
# vulnerability; this is what turns that red build into a green pull request
# with the fix in it -- for a module. A fix in the standard library is a new
# go line in go.mod, which Dependabot never moves; .github/workflows/go-version.yml
# proposes those.
#
# One pull request per ecosystem per week, not one per module: merging the
# first of three puts the other two into conflict on the same lines of go.mod.
# Grouped, the week's bumps arrive together, CI runs once, and there is nothing
# to conflict with.
#
# .github/workflows/dependabot-merge.yml merges them after a day with CI green,
# and deploys.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Indirect requires too, not only direct ones (the default). The tools are
    # among them: govulncheck is a `tool` line, so golang.org/x/vuln is an
    # indirect require, and by default it stayed at v1.6.0 while v1.9.0 was
    # out (2026-10-26). The scanner that gates every merge should not be the
    # one pin nothing moves.
    allow:
      - dependency-type: all
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
